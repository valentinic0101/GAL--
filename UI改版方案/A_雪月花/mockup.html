<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案 A · 雪月花（和风旗舰）</title>
<!--
  方案 A「雪月花」—— 参考柚子社《千恋＊万花》/ KEY《Summer Pockets》系统的和风旗舰 UI。
  设计要点：和纸暖白实体面板 + 极细墨线 + 朱红落款色 + 金点缀。
  关键决策：面板是「不透明暖白」，因此无论背景是均值 30 的暗走廊还是均值 194 的暴风雪，
  文字对比度都恒定 —— 这是本作素材亮度跨度极大（30→194）条件下唯一稳的解。
  DOM 结构与 class 名刻意与 game/web/index.html 保持一致，便于直接移植。
-->
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0c14}
body{
  font-family:"Hiragino Mincho ProN","Yu Mincho","Songti SC","Noto Serif SC",serif;
  color:#2a251d;
  /* —— 设计令牌（单一来源）—— */
  --washi:#f8f4ea;          /* 和纸暖白主色 */
  --washi-2:#efe7d6;        /* 和纸渐变压色 */
  --washi-3:#e6dbc4;        /* 和纸描边色 */
  --ink:#2a251d;            /* 墨（正文） */
  --ink-2:#5a5145;          /* 淡墨（次要文字）—— 实测需 >=4.5:1，原 #6b6152 仅 4.28 */
  --ink-3:#6b6353;          /* 更淡（标注）—— 实测 13px 需 >=4.5:1，原 #948a78 仅 3.0 */
  --vermilion:#b6433a;      /* 朱红（落款/强调） */
  --gold:#a98b4f;           /* 金（点缀） */
  --hairline:rgba(122,102,72,.34);
  --shadow:0 14px 38px rgba(22,18,12,.44);
  --r-sm:6px; --r-md:10px; --r-lg:14px;   /* 圆角只留 3 级 */
}

/* ================= 画面容器 ================= */
.screen{position:fixed;inset:0;display:none}
.screen.active{display:block}

/* ================= 雪（标题页也有 —— 修复原版标题无雪的缺口） ================= */
.snowflake{position:absolute;top:-8vh;border-radius:50%;background:#fff;
  animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite;pointer-events:none}
@keyframes fall{
  0%{transform:translate(0,-8vh) translateX(0)}
  25%{transform:translate(4vw,22vh) translateX(1vw)}
  50%{transform:translate(-3vw,52vh) translateX(-1vw)}
  75%{transform:translate(3vw,80vh)}
  100%{transform:translate(-2vw,110vh)}
}

/* ================================================================
   ① 标题画面
   修复：原版 UI 假设背景暗，实际 bg_title 均值 166（明亮雪原）→ 标题 2.4:1。
   本方案把标题改为「浓墨压亮雪」，对比度 ~11:1；菜单用和纸实体卡片。
   ================================================================ */
#title-screen{background:#0a0c14}
.title-bg{position:absolute;inset:0;
  background:url('../../game/assets/backgrounds/bg_title.png') center/cover no-repeat}
/* 雪原太亮且均匀 → 只在其上叠一层极淡的冷调，不做压暗（压暗会丢掉雪的透亮） */
.title-scrim{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 78% at 50% 34%, rgba(255,255,255,.30) 0%, rgba(255,255,255,0) 58%),
    linear-gradient(180deg, rgba(150,175,205,.16) 0%, rgba(255,255,255,0) 34%, rgba(70,95,130,.28) 100%)}
.title-snow{position:absolute;inset:0;overflow:hidden;pointer-events:none}

.title-content{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:34px}

/* 题字：浓墨 + 朱红落款印 */
.game-title{text-align:center;position:relative}
.game-title h1{
  font-size:104px;letter-spacing:.16em;margin-left:.16em;font-weight:600;
  color:#1d2a3b;
  text-shadow:0 1px 0 rgba(255,255,255,.85), 0 8px 26px rgba(255,255,255,.55), 0 2px 3px rgba(30,45,70,.30)}
.game-title .seal{
  position:absolute;right:-64px;top:50%;transform:translateY(-30%);
  width:44px;height:44px;border-radius:5px;
  background:linear-gradient(160deg,#c2503f,#9e352c);
  color:#fdf6ea;font-size:22px;line-height:44px;text-align:center;
  box-shadow:0 4px 14px rgba(120,40,30,.45), inset 0 1px 0 rgba(255,255,255,.30);
  letter-spacing:0}
.game-title .subtitle{
  font-size:24px;letter-spacing:.5em;margin-left:.5em;color:#3d4f66;margin-top:6px;font-style:normal}
.game-title .tagline{
  margin-top:24px;font-size:15.5px;color:#33445a;letter-spacing:.16em;
  text-shadow:0 1px 0 rgba(255,255,255,.8), 0 2px 10px rgba(255,255,255,.6)}

.title-menu{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.title-btn{
  min-width:250px;padding:13px 38px;font-size:18px;letter-spacing:.42em;text-indent:.42em;
  font-family:inherit;font-weight:500;color:#2a3346;cursor:pointer;
  background:linear-gradient(180deg, rgba(252,249,242,.95), rgba(238,230,214,.95));
  border:1px solid var(--hairline);border-left:3px solid var(--gold);border-radius:var(--r-sm);
  box-shadow:0 5px 18px rgba(30,45,70,.26), inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .22s ease, box-shadow .22s ease, border-left-color .22s ease, background .22s ease}
.title-btn:hover{
  background:linear-gradient(180deg,#fffdf8,#f4ecdc);
  border-left-color:var(--vermilion);
  transform:translateX(6px);
  box-shadow:0 9px 26px rgba(30,45,70,.32), inset 0 1px 0 #fff}
.title-btn.primary{ /* 「开始游戏」为主操作，给独立视觉权重（原版三按钮等权） */
  border-left-color:var(--vermilion);
  background:linear-gradient(180deg,#fffdf7,#f6eddb);
  font-size:19px}
.title-footer{
  position:absolute;bottom:24px;font-size:12.5px;letter-spacing:.24em;color:#2f4054;
  text-shadow:0 1px 0 rgba(255,255,255,.9), 0 2px 8px rgba(255,255,255,.75)}

/* ================================================================
   ② 游戏画面
   ================================================================ */
#game-screen{background:#080a10}
#bg-layer{position:absolute;inset:0}
.bg-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;
  transition:opacity 1.1s ease}
.bg-img.show{opacity:1}
#snow-overlay{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 58%, rgba(8,10,20,.42) 100%)}

/* —— 立绘 —— */
#sprite-layer{position:absolute;inset:0;pointer-events:none}
.sprite{position:absolute;bottom:0;height:var(--h,74%);left:var(--x,50%);
  transform:translateX(-50%) scale(var(--s,1));transform-origin:50% 100%;opacity:0;
  transition:opacity .45s ease,left .55s ease,height .4s ease,bottom .4s ease,transform .4s ease}
.sprite.on{opacity:1}
.sprite.speaking{z-index:5}
.sprite img{height:100%;display:block}
.sprite .shadow{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(8,10,18,.85) 0%, rgba(8,10,18,.4) 45%, rgba(8,10,18,0) 72%);
  pointer-events:none}

/* ================================================================
   ③ 顶部 HUD —— 修复：原版「状态条 + 菜单栏」两条互不统一的横条
   本方案合并为「一条和纸带」，左信息 / 右菜单，同一高度、同一底色、同一字号。
   ================================================================ */
#hud{
  position:absolute;top:0;left:0;right:0;z-index:25;
  display:flex;align-items:stretch;height:44px;
  background:linear-gradient(180deg, rgba(248,243,232,.94), rgba(238,230,214,.88));
  border-bottom:1px solid var(--hairline);
  box-shadow:0 3px 14px rgba(20,26,40,.22);
  backdrop-filter:blur(6px)}
#status-bar{display:flex;align-items:center;gap:0;flex:1;min-width:0;
  font-size:12.5px;letter-spacing:.10em;color:#4a4136;padding-left:16px}
#status-bar .st{display:flex;align-items:center;height:100%;padding:0 13px;white-space:nowrap}
#status-bar .st + .st{border-left:1px solid rgba(122,102,72,.22)}
#status-bar .st-phase{color:#2a251d;font-weight:600;letter-spacing:.16em}
#status-bar .st-axes{color:#534b40;font-size:12px;letter-spacing:.06em}
#status-bar .warn{color:var(--vermilion);font-weight:600}
#menu-bar{display:flex;align-items:center;gap:5px;padding:0 12px}
.menu-btn{
  padding:6px 13px;font-size:12.5px;font-family:inherit;color:#3d4a5c;cursor:pointer;
  background:rgba(255,255,255,.55);border:1px solid rgba(122,102,72,.28);
  border-radius:var(--r-sm);letter-spacing:.16em;transition:all .18s}
.menu-btn:hover{background:#fff;color:var(--vermilion);border-color:var(--vermilion)}
.menu-btn.on{background:var(--vermilion);color:#fdf6ea;border-color:var(--vermilion)}
/* BGM 开关：原版 ♪ 一号三义（音乐/好感/羁绊），此处改用 ♫ 并在静音时给出明确区分 */
.menu-btn.icon{font-size:14px;letter-spacing:0;padding:6px 11px}
.menu-btn.icon.off{color:#a49a88;text-decoration:line-through;background:rgba(255,255,255,.32)}

/* ================================================================
   ④ 对话框 —— 和纸实体面板
   修复：原版深蓝半透明框在「亮背景」上糊、在「暗背景」上与底色分不开；
   和纸暖白面板 + 墨字，在任何背景上都恒定高对比。
   ================================================================ */
#dialog-box{
  position:absolute;left:50%;bottom:32px;transform:translateX(-50%);
  width:min(1040px,90vw);min-height:178px;z-index:20;cursor:pointer;
  padding:24px 38px 22px 40px;border-radius:var(--r-md);
  background:
    repeating-linear-gradient(90deg, rgba(160,140,105,.055) 0 1px, transparent 1px 4px),
    linear-gradient(180deg, rgba(252,249,242,.965), rgba(240,232,216,.965));
  border:1px solid var(--washi-3);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.45);
  backdrop-filter:blur(7px)}
/* 名牌：和纸札 + 朱红落款条（替代原版金框深蓝牌） */
#nameplate{
  position:absolute;top:-31px;left:26px;padding:7px 24px 7px 20px;
  background:linear-gradient(180deg,#fffdf8,#f2ead8);
  border:1px solid var(--washi-3);border-left:3px solid var(--vermilion);
  border-radius:var(--r-sm);box-shadow:0 5px 16px rgba(22,18,12,.34);
  font-size:18px;letter-spacing:.22em;color:#2a251d;font-weight:600}
#action-text{font-size:13px;color:var(--ink-3);margin-bottom:7px;line-height:1.7;
  letter-spacing:.10em;font-style:normal}   /* 去掉 CJK 合成假斜体 */
#dialog-text{font-size:21px;line-height:1.92;letter-spacing:.035em;color:#2a251d;min-height:84px}
#next-indicator{position:absolute;right:24px;bottom:12px;color:var(--vermilion);
  font-size:13px;animation:bounce 1.2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* ================================================================
   ⑤ 旁白框 —— 与对话框统一视觉语言
   修复：原版旁白框 = 无边框无投影的「更黑矩形」（框内 25 vs 框外 40，判定不出边界）、
   且宽度 900/底部 56/字号 19/▼居中 与对话框全部不一致。
   本方案：同面板几何（宽 1040 / 底 32 / 圆角 10），仅正文居中 + 顶部一道朱红细线区分。
   ================================================================ */
#narration-box{
  position:absolute;left:50%;bottom:32px;transform:translateX(-50%);
  width:min(1040px,90vw);z-index:19;cursor:pointer;text-align:center;
  padding:28px 44px 24px;border-radius:var(--r-md);
  background:
    repeating-linear-gradient(90deg, rgba(160,140,105,.055) 0 1px, transparent 1px 4px),
    linear-gradient(180deg, rgba(252,249,242,.965), rgba(240,232,216,.965));
  border:1px solid var(--washi-3);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.45);
  backdrop-filter:blur(7px)}
#narration-box::before{  /* 朱红顶线：一眼区分「这是旁白」 */
  content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  width:64px;height:2px;background:var(--vermilion);border-radius:0 0 2px 2px}
#narration-text{font-size:19.5px;line-height:2.02;color:#332d24;letter-spacing:.045em;font-style:normal}
#next-indicator-n{color:var(--vermilion);font-size:13px;margin-top:11px;animation:bounce 1.2s infinite}

/* ================================================================
   ⑥ 选项 —— 和纸长条 + 朱红指示条
   ================================================================ */
#choice-panel{position:absolute;left:50%;bottom:246px;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:10px;z-index:22;width:min(660px,90vw)}
.choice-btn{
  position:relative;padding:14px 26px 14px 34px;font-size:17.5px;font-family:inherit;
  letter-spacing:.10em;color:#2a251d;text-align:left;cursor:pointer;
  background:linear-gradient(180deg, rgba(252,249,242,.95), rgba(238,230,214,.95));
  border:1px solid var(--washi-3);border-radius:var(--r-sm);
  box-shadow:0 5px 18px rgba(22,18,12,.30), inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease}
.choice-btn::before{ /* 左侧指示条：hover 时由金转朱红并加长 —— 提供非颜色单一的反馈 */
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:54%;background:var(--gold);border-radius:0 2px 2px 0;transition:all .2s}
.choice-btn:hover{
  transform:translateX(6px);border-color:var(--vermilion);
  background:linear-gradient(180deg,#fffdf8,#f5ecdb);
  box-shadow:0 9px 26px rgba(22,18,12,.36), inset 0 1px 0 #fff}
.choice-btn:hover::before{background:var(--vermilion);height:78%}
.choice-btn.free{opacity:.9;border-style:dashed;color:var(--ink-2);font-size:16px}
.choice-btn.free::before{background:var(--ink-3)}

/* ================================================================
   ⑦ 幕间面板 / 自由输入
   ================================================================ */
#interlude-panel{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
  z-index:21;width:min(980px,94vw);padding:20px 26px;border-radius:var(--r-md);
  background:linear-gradient(180deg, rgba(252,249,242,.96), rgba(240,232,216,.96));
  border:1px solid var(--washi-3);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(7px)}
.inter-note{font-size:16px;color:#3a3327;line-height:1.9;margin-bottom:14px;letter-spacing:.05em}
.inter-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.inter-btn{padding:10px 22px;font-size:15px;font-family:inherit;letter-spacing:.16em;cursor:pointer;
  color:#2a251d;background:linear-gradient(180deg,#fffdf8,#f0e8d6);
  border:1px solid var(--washi-3);border-radius:var(--r-sm);transition:all .2s}
.inter-btn:hover{border-color:var(--vermilion);color:var(--vermilion);transform:translateY(-1px)}
.inter-btn.scene-offer{border-color:var(--vermilion);color:#fff;font-weight:600;
  background:linear-gradient(180deg,#c2503f,#a53a30);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(182,67,58,0)}
  50%{box-shadow:0 0 20px rgba(182,67,58,.55)}}
.inter-group{display:flex;gap:8px;align-items:center}
.grp-label{font-size:13px;color:var(--ink-3);letter-spacing:.16em}
#move-btns{display:flex;gap:8px}
.move-btn{font-size:13.5px;font-family:inherit;color:#3a4a5e;cursor:pointer;padding:8px 15px;
  background:rgba(255,255,255,.6);border:1px solid rgba(122,102,72,.28);border-radius:var(--r-sm);
  transition:all .18s}
.move-btn:hover{border-color:var(--vermilion);color:var(--vermilion);background:#fff}

#input-panel{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:22;
  width:min(760px,92vw);padding:18px 20px;border-radius:var(--r-md);
  background:linear-gradient(180deg, rgba(252,249,242,.96), rgba(240,232,216,.96));
  border:1px solid var(--washi-3);box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9)}
.input-hint{font-size:14px;color:var(--ink-2);margin-bottom:10px;letter-spacing:.10em}
.input-row{display:flex;gap:10px}
#free-input{flex:1;padding:11px 16px;font-size:17px;font-family:inherit;color:#2a251d;
  background:rgba(255,255,255,.75);border:1px solid rgba(122,102,72,.34);
  border-radius:var(--r-sm);outline:none;transition:border-color .18s}
#free-input:focus{border-color:var(--vermilion);background:#fff}
#btn-send{padding:0 26px;font-size:16px;font-family:inherit;cursor:pointer;color:#fdf6ea;
  background:linear-gradient(180deg,#c2503f,#a53a30);border:1px solid #8f3229;
  border-radius:var(--r-sm);letter-spacing:.16em}
.input-quick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.quick{font-size:13px;font-family:inherit;color:var(--ink-2);background:rgba(255,255,255,.6);
  border:1px solid rgba(122,102,72,.26);border-radius:20px;padding:5px 14px;cursor:pointer;
  transition:all .18s}
.quick:hover{color:var(--vermilion);border-color:var(--vermilion);background:#fff}

/* ================================================================
   ⑧ 存档 / 菜单 / 回想弹窗
   ================================================================ */
#modal{position:fixed;inset:0;background:rgba(14,18,28,.62);z-index:50;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal-box{width:min(720px,92vw);max-height:80vh;overflow:auto;padding:26px 30px;
  border-radius:var(--r-lg);border:1px solid var(--washi-3);
  background:linear-gradient(180deg,#fbf8f0,#f0e8d6);
  box-shadow:0 26px 70px rgba(10,14,24,.6), inset 0 1px 0 #fff}
.modal-title{font-size:19px;letter-spacing:.42em;color:#2a251d;font-weight:600;
  margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--hairline);
  display:flex;align-items:center;gap:12px}
.modal-title::before{content:'';width:4px;height:19px;background:var(--vermilion);border-radius:2px}
.modal-body{font-size:15px;line-height:2;color:#3a3327}
.save-slot{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.log-item{padding:9px 4px;border-bottom:1px dashed rgba(122,102,72,.22)}
.log-item .log-name{color:var(--vermilion);margin-right:10px;font-weight:600}
.log-item.narration{color:var(--ink-2)}
.world-kv{margin:5px 0}
.world-kv b{color:var(--vermilion);font-weight:600}
.rumor{color:#8a5a62}
/* 存档槽卡片 */
.slot-card{display:flex;align-items:center;gap:16px;padding:13px 16px;margin-bottom:10px;
  border:1px solid var(--washi-3);border-radius:var(--r-sm);
  background:linear-gradient(180deg,#fffdf8,#f6efdf);transition:all .2s}
.slot-card:hover{border-color:var(--vermilion);transform:translateX(4px);
  box-shadow:0 6px 20px rgba(22,18,12,.18)}
.slot-no{width:38px;height:38px;flex:0 0 38px;border-radius:var(--r-sm);
  background:linear-gradient(160deg,#c2503f,#9e352c);color:#fdf6ea;
  font-size:17px;line-height:38px;text-align:center;font-weight:600}
.slot-meta{flex:1;min-width:0}
.slot-meta .s-title{font-size:15px;color:#2a251d;letter-spacing:.08em}
.slot-meta .s-sub{font-size:12.5px;color:var(--ink-3);margin-top:3px;letter-spacing:.08em}
.slot-act .inter-btn{padding:8px 18px;font-size:13.5px}

/* 弹窗内的设置行 */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:13px 4px;border-bottom:1px dashed rgba(122,102,72,.22)}
.set-row:last-child{border-bottom:none}
.set-label{font-size:15px;color:#2a251d;letter-spacing:.08em}
.set-label small{display:block;font-size:12px;color:var(--ink-3);margin-top:3px;letter-spacing:.06em}
.set-ctl{display:flex;gap:6px;align-items:center}
.seg{border:1px solid var(--washi-3);border-radius:var(--r-sm);overflow:hidden;display:flex}
.seg button{padding:7px 16px;font-size:13px;font-family:inherit;cursor:pointer;color:#4a4136;
  background:rgba(255,255,255,.7);border:none;border-right:1px solid var(--washi-3);
  letter-spacing:.12em;transition:all .16s}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--vermilion);color:#fdf6ea}
.vol-track{position:relative;width:150px;height:5px;border-radius:3px;background:rgba(122,102,72,.22)}
.vol-fill{position:absolute;left:0;top:0;height:100%;width:62%;border-radius:3px;
  background:var(--vermilion)}
.vol-knob{position:absolute;top:50%;left:62%;width:14px;height:14px;margin:-7px 0 0 -7px;
  border-radius:50%;background:#fff;border:2px solid var(--vermilion);
  box-shadow:0 2px 6px rgba(0,0,0,.25)}

/* Toast */
#toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:60;
  padding:10px 26px;border-radius:var(--r-sm);font-size:14.5px;letter-spacing:.16em;
  color:#2a251d;background:linear-gradient(180deg,#fbf8f0,#f0e8d6);
  border:1px solid var(--washi-3);border-left:3px solid var(--vermilion);
  box-shadow:0 10px 30px rgba(10,14,24,.4)}

/* 等待模型指示器 */
#llm-wait{position:fixed;right:18px;bottom:14px;z-index:40;width:176px;padding:9px 12px;
  border-radius:var(--r-sm);pointer-events:none;opacity:.9;
  background:linear-gradient(180deg, rgba(251,248,240,.94), rgba(240,232,216,.94));
  border:1px solid var(--washi-3);box-shadow:0 6px 20px rgba(10,14,24,.3)}
.lw-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.lw-dot{width:5px;height:5px;border-radius:50%;background:var(--vermilion);
  animation:lwpulse 1.4s ease-in-out infinite}
@keyframes lwpulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
#lw-text{font-size:11.5px;letter-spacing:.10em;color:#5b5245;flex:1}
#lw-sec{font-size:10.5px;color:var(--ink-3);font-family:Menlo,monospace}
.lw-track{height:2px;background:rgba(122,102,72,.2);border-radius:2px;overflow:hidden}
.lw-bar{height:100%;width:34%;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--vermilion),transparent);
  animation:lwslide 1.6s linear infinite}
@keyframes lwslide{0%{transform:translateX(-110%)}100%{transform:translateX(410%)}}

/* 场景标题卡 */
#scene-title-card{position:absolute;inset:0;z-index:30;display:flex;align-items:center;
  justify-content:center;background:rgba(6,8,16,.62);pointer-events:none}
#scene-title-card span{font-size:42px;letter-spacing:.42em;text-indent:.42em;color:#f6f2e8;
  text-shadow:0 0 30px rgba(150,185,235,.75), 0 4px 18px rgba(0,0,0,.8)}

.hidden{display:none !important}
</style>
</head>
<body>

<!-- ============ ① 标题 ============ -->
<div id="title-screen" class="screen active">
  <div class="title-bg"></div>
  <div class="title-scrim"></div>
  <div class="title-snow" id="title-snow"></div>
  <div class="title-content">
    <div class="game-title">
      <h1>深雪</h1>
      <div class="seal">雪</div>
      <div class="subtitle">miyuki</div>
      <div class="tagline">她一直在等，我一直在逃，雪一直落在两人之间。</div>
    </div>
    <div class="title-menu">
      <button class="title-btn primary">开始游戏</button>
      <button class="title-btn">继续旅程</button>
      <button class="title-btn">读取存档</button>
      <button class="title-btn">设　　置</button>
    </div>
    <div class="title-footer">雪 国 奇 谭 · 第 一 部　—　ver 1.0</div>
  </div>
</div>

<!-- ============ ② 游戏画面 ============ -->
<div id="game-screen" class="screen">
  <div id="bg-layer">
    <div id="bg-a" class="bg-img show"></div>
    <div id="bg-b" class="bg-img"></div>
  </div>
  <div id="snow-overlay"></div>
  <div id="vignette"></div>
  <div id="sprite-layer"></div>

  <!-- 合并式 HUD：左信息 + 右菜单，同一条和纸带 -->
  <div id="hud">
    <div id="status-bar">
      <span class="st st-phase">P1 · 初遇</span>
      <span class="st">第 1 天</span>
      <span class="st">老屋 · 客厅</span>
      <span class="st">深雪 <b>50</b></span>
      <span class="st st-axes">羁绊♪20　山之念▲15　现世◇15</span>
      <span class="st warn">冬祭还有 3 天</span>
    </div>
    <div id="menu-bar">
      <button class="menu-btn icon" title="背景音乐">♫</button>
      <button class="menu-btn">自动</button>
      <button class="menu-btn">日志</button>
      <button class="menu-btn">世界</button>
      <button class="menu-btn">存档</button>
      <button class="menu-btn">读档</button>
      <button class="menu-btn">设置</button>
      <button class="menu-btn">标题</button>
    </div>
  </div>

  <!-- 对话框 -->
  <div id="dialog-box" class="hidden">
    <div id="nameplate"><span id="name-text">深雪</span></div>
    <div id="action-text">（得到解放的她像肋下生出了双翅，在这片凄清冷寂的天地中欢快地奔走）</div>
    <div id="dialog-text">呐，你喜欢雪吗？</div>
    <div id="next-indicator">▼</div>
  </div>

  <!-- 旁白框 -->
  <div id="narration-box" class="hidden">
    <div id="narration-text">亲戚们总是将简单的道理，说得很拐弯抹角。他们围绕着同一个话题，商议了好几个小时——在亲戚中，到底由谁来收养我。必须有人来抽到这个下下签。</div>
    <div id="next-indicator-n">▼</div>
  </div>

  <!-- 选项 -->
  <div id="choice-panel" class="hidden">
    <button class="choice-btn">……我喜欢这雪</button>
    <button class="choice-btn">我…不了解…</button>
    <button class="choice-btn">（长久地沉默）</button>
    <button class="choice-btn free">✎　自由输入想说的话…</button>
  </div>

  <!-- 幕间 -->
  <div id="interlude-panel" class="hidden">
    <div class="inter-note">雪还在下。距冬祭还有三天。</div>
    <div class="inter-actions">
      <div class="inter-group"><span class="grp-label">移动</span>
        <div id="move-btns">
          <button class="move-btn">→ 老屋 · 庭院</button>
          <button class="move-btn">→ 镇上街道</button>
          <button class="move-btn">→ 神社</button>
        </div>
      </div>
      <button class="inter-btn">交谈</button>
      <button class="inter-btn">等待 / 过夜</button>
      <button class="inter-btn scene-offer">▶ 推进剧情：清雪</button>
    </div>
  </div>

  <div id="llm-wait">
    <div class="lw-row"><span class="lw-dot"></span><span id="lw-text">等待深雪回应</span><span id="lw-sec">2s</span></div>
    <div class="lw-track"><div class="lw-bar"></div></div>
  </div>
</div>

<!-- ============ ⑧ 存档 / 菜单弹窗 ============ -->
<div id="modal" class="hidden">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">读 档</div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
/* —— 截屏用：根据 hash 切换要展示的画面，并摆好立绘 —— */
const BG = {
  corridor: '../../game/assets/backgrounds/bg_oldhouse_corridor.png',
  blizzard: '../../game/assets/backgrounds/bg_mountains_blizzard.png',
  courtyard: '../../game/assets/backgrounds/bg_courtyard.png',
  festival: '../../game/assets/backgrounds/bg_town_night_festival.png',
};
const SPR = {
  miyuki:   '../../game/assets/sprites/miyuki_smile.png',
  miyukiN:  '../../game/assets/sprites/miyuki_normal.png',
  shuuji:   '../../game/assets/sprites/shuuji_child.png',
  man:      '../../game/assets/sprites/relative_man.png',
  woman:    '../../game/assets/sprites/relative_woman.png',
};

/* 立绘上镜：发言者 1.0 亮度，非发言者 0.86（原版 ×0.74 叠暗场景基色 ×0.60 = 44%，导致主角与空景无法区分） */
function setSprites(list, sceneLight = 1) {
  const layer = document.getElementById('sprite-layer');
  layer.innerHTML = '';
  const n = list.length;
  const xs = n === 1 ? [.62] : n === 2 ? [.26, .74] : [.13, .46, .79];
  list.forEach((sp, i) => {
    const box = document.createElement('div');
    box.className = 'sprite on' + (sp.speak ? ' speaking' : '');
    box.style.setProperty('--x', (xs[i] * 100) + '%');
    box.style.height = (sp.h || 74) + '%';
    box.style.zIndex = sp.speak ? 5 : 1;
    const img = document.createElement('img');
    img.src = sp.src;
    const b = (sp.speak ? 1 : .86) * sceneLight;
    img.style.filter = `brightness(${b.toFixed(2)}) contrast(1.02)`;
    box.appendChild(img);
    const sh = document.createElement('div');
    sh.className = 'shadow';
    box.appendChild(sh);
    layer.appendChild(box);
  });
}
function setBg(url, dim) {
  const a = document.getElementById('bg-a');
  a.style.backgroundImage = `url('${url}')`;
  a.style.filter = dim ? `brightness(${dim})` : '';
}
function snow(id, n) {
  const el = document.getElementById(id);
  let h = '';
  for (let i = 0; i < n; i++) {
    const s = 2 + Math.random() * 5, l = Math.random() * 100,
          d = 7 + Math.random() * 12, del = -Math.random() * 18, o = .4 + Math.random() * .55;
    h += `<div class="snowflake" style="left:${l}vw;width:${s}px;height:${s}px;opacity:${o};animation-duration:${d}s;animation-delay:${del}s"></div>`;
  }
  el.innerHTML = h;
}
function show(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const title = document.getElementById('title-screen');
  const game = document.getElementById('game-screen');
  const ids = ['dialog-box', 'narration-box', 'choice-panel', 'interlude-panel'];
  ids.forEach(i => document.getElementById(i).classList.add('hidden'));
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('llm-wait').style.display = 'none';
  if (name === 'title') { title.classList.add('active'); return; }
  game.classList.add('active');

  if (name === 'dialog') {
    // 明亮庭院 + 深雪发言（正面案例：亮底 + 不透明和纸面板）
    setBg(BG.blizzard, .96);
    setSprites([
      { src: SPR.miyuki, speak: true, h: 78 },
      { src: SPR.shuuji, speak: false, h: 68 },
    ], .98);
    document.getElementById('dialog-box').classList.remove('hidden');
  } else if (name === 'dialog_dark') {
    // 极暗走廊（均值 34）+ 三人 —— 修复原版「主角立绘与空景无法区分」
    setBg(BG.corridor, 1);
    setSprites([
      { src: SPR.shuuji, speak: false, h: 66 },
      { src: SPR.man, speak: true, h: 72 },
      { src: SPR.woman, speak: false, h: 73 },
    ], 1.18);
    document.getElementById('dialog-box').classList.remove('hidden');
    document.getElementById('name-text').textContent = '叔父';
    document.getElementById('action-text').textContent = '（他推了推眼镜，视线游移开）';
    document.getElementById('dialog-text').textContent = '麻烦呐——';
  } else if (name === 'narration') {
    setBg(BG.corridor, 1);
    setSprites([], 1);
    document.getElementById('narration-box').classList.remove('hidden');
  } else if (name === 'choice') {
    setBg(BG.courtyard, .98);
    setSprites([{ src: SPR.miyukiN, speak: true, h: 74 }], .98);
    document.getElementById('dialog-box').classList.remove('hidden');
    document.getElementById('dialog-text').textContent = '呐，你喜欢雪吗？';
    document.getElementById('action-text').classList.add('hidden');
    document.getElementById('choice-panel').classList.remove('hidden');
  } else if (name === 'save') {
    setBg(BG.festival, 1);
    setSprites([{ src: SPR.miyuki, speak: false, h: 70 }], 1);
    document.getElementById('modal-title').textContent = '读 档';
    document.getElementById('modal-body').innerHTML = `
      <div class="slot-card"><div class="slot-no">1</div>
        <div class="slot-meta"><div class="s-title">P2 · 清雪之后</div>
          <div class="s-sub">第 2 天 · 老屋 · 庭院 · 深雪 58 · 冬祭还有 2 天</div></div>
        <div class="slot-act"><button class="inter-btn">读取</button></div></div>
      <div class="slot-card"><div class="slot-no">2</div>
        <div class="slot-meta"><div class="s-title">P3 · 冬祭前夜</div>
          <div class="s-sub">第 3 天 · 镇上街道 · 深雪 66 · 冬祭还有 1 天</div></div>
        <div class="slot-act"><button class="inter-btn">读取</button></div></div>
      <div class="slot-card"><div class="slot-no">3</div>
        <div class="slot-meta"><div class="s-title">（空档位）</div>
          <div class="s-sub">— 尚未保存 —</div></div>
        <div class="slot-act"><button class="inter-btn">保存</button></div></div>`;
    document.getElementById('modal').classList.remove('hidden');
  } else if (name === 'settings') {
    setBg(BG.festival, 1);
    setSprites([], 1);
    document.getElementById('modal-title').textContent = '设 置';
    document.getElementById('modal-body').innerHTML = `
      <div class="set-row"><div class="set-label">文字速度<small>打字机逐字显示的速度</small></div>
        <div class="set-ctl"><div class="seg"><button>慢</button><button class="on">标准</button><button>快</button><button>瞬间</button></div></div></div>
      <div class="set-row"><div class="set-label">背景音乐<small>当前：冬日小镇</small></div>
        <div class="set-ctl"><div class="vol-track"><div class="vol-fill"></div><div class="vol-knob"></div></div></div></div>
      <div class="set-row"><div class="set-label">自动播放间隔<small>自动模式下每句停留时间</small></div>
        <div class="set-ctl"><div class="seg"><button class="on">1.4s</button><button>2.4s</button><button>4.0s</button></div></div></div>
      <div class="set-row"><div class="set-label">飘雪与特效<small>关闭可提升低配设备帧率</small></div>
        <div class="set-ctl"><div class="seg"><button class="on">开</button><button>关</button></div></div></div>`;
    document.getElementById('modal').classList.remove('hidden');
  } else if (name === 'interlude') {
    setBg(BG.festival, 1);
    setSprites([], 1);
    document.getElementById('interlude-panel').classList.remove('hidden');
    document.getElementById('llm-wait').style.display = '';
  }
}
snow('title-snow', 46);
snow('snow-overlay', 70);
show((location.hash || '#title').slice(1));
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
</script>
</body>
</html>
